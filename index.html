<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신나는 수학 탐험 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        .tab-active {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            font-weight: bold;
        }
        .tab-inactive {
            background-color: #e5e7eb; /* gray-200 */
            color: #4b5563; /* gray-600 */
        }
        .unit-active {
            border-left: 4px solid #4f46e5;
            background-color: #e0e7ff; /* indigo-50 */
            color: #3730a3; /* indigo-800 */
            font-weight: bold;
        }
        .unit-inactive {
            border-left: 4px solid transparent;
            color: #4b5563;
        }
        .unit-inactive:hover {
            background-color: #f3f4f6;
        }
        /* 페이드 인 애니메이션 */
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <!-- 로고 이미지 추가: 경로 ./images/logo.png -->
                <div class="bg-white p-1.5 rounded-xl shadow-inner flex items-center justify-center overflow-hidden w-12 h-12">
                    <img src="./images/logo.png" alt="로고" class="max-w-full max-h-full object-contain" onerror="this.outerHTML='<i class=\'fa-solid fa-square-root-variable text-blue-600 text-2xl\'></i>'">
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight leading-none">신나는 수학 탐험</h1>
                    <p class="hidden sm:block text-xs text-indigo-100 font-medium mt-1">선생님과 함께하는 즐거운 시간 ✨</p>
                </div>
            </div>
            
            <!-- 질문하기 버튼 -->
            <button onclick="openQuestionModal()" class="flex items-center gap-2 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold py-2.5 px-5 rounded-2xl transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-md">
                <i class="fa-solid fa-comment-dots"></i>
                <span>질문하기</span>
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col lg:flex-row gap-8">
        
        <aside class="w-full lg:w-1/4 flex flex-col gap-4 shrink-0">
            <!-- 학년 선택 탭 -->
            <div class="bg-white p-2 rounded-2xl shadow-sm flex gap-2">
                <button id="btn-grade1" class="flex-1 py-3 rounded-xl transition-all duration-200 text-center tab-active" onclick="setGrade(1)">
                    <i class="fa-solid fa-1 mr-1"></i>학년
                </button>
                <button id="btn-grade2" class="flex-1 py-3 rounded-xl transition-all duration-200 text-center tab-inactive" onclick="setGrade(2)">
                    <i class="fa-solid fa-2 mr-1"></i>학년
                </button>
            </div>

            <!-- 단원 목록 -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                <div class="bg-gray-50 px-4 py-3 border-b border-gray-100">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider">단원 선택</h2>
                </div>
                <div id="unit-list" class="flex flex-col py-2">
                    <!-- JS로 동적 생성됨 -->
                </div>
            </div>
        </aside>

        <section class="w-full lg:w-3/4 flex flex-col gap-6 fade-in" id="content-area">
            <!-- 타이틀 카드 -->
            <div class="bg-white rounded-3xl shadow-md p-8 border-t-8 border-indigo-500 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-8 opacity-10">
                    <i class="fa-solid fa-shapes text-8xl"></i>
                </div>
                <h2 id="content-title" class="text-3xl font-black text-gray-800 mb-2">단원 제목</h2>
                <p id="content-subtitle" class="text-xl text-indigo-600 font-bold mb-4">"서브 타이틀"</p>
            </div>

            <!-- 3단계 구성 (Hook, Concept, Wrap-up) -->
            <div class="grid grid-cols-1 md:grid-cols-1 gap-6">
                
                <!-- 1. 수업 도입 (Hook) -->
                <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-3xl shadow-sm p-6 border border-orange-100">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="bg-orange-400 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-lightbulb text-xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800">1. 생각 열기 (수업 도입)</h3>
                    </div>
                    <div id="content-hook" class="text-gray-700 leading-relaxed text-lg bg-white p-5 rounded-2xl shadow-inner">
                        <!-- 내용 -->
                    </div>
                </div>

                <!-- 2. 개념 설명 (Concept) -->
                <div class="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-3xl shadow-sm p-6 border border-blue-100">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="bg-blue-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-book-open text-xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800">2. 핵심 쏙쏙 (개념 설명)</h3>
                    </div>
                    
                    <!-- 키워드 -->
                    <div id="content-keywords" class="flex flex-wrap gap-2 mb-4">
                        <!-- JS로 동적 생성됨 -->
                    </div>

                    <div class="flex flex-col sm:flex-row gap-6">
                        <div id="content-concept" class="flex-1 text-gray-700 leading-relaxed text-lg bg-white p-5 rounded-2xl shadow-inner">
                            <!-- 내용 -->
                        </div>
                        <!-- 시각화 이미지 플레이스홀더 -->
                        <div class="w-full sm:w-1/3 bg-blue-100 rounded-2xl flex items-center justify-center p-6 text-center shadow-inner border border-blue-200 min-h-[150px]">
                            <p id="content-image-text" class="text-blue-600 font-bold text-sm">
                                <!-- 시각화 텍스트 -->
                            </p>
                        </div>
                    </div>
                </div>

                <!-- 3. 수업 정리 (Wrap-up) -->
                <div class="bg-gradient-to-br from-emerald-50 to-green-50 rounded-3xl shadow-sm p-6 border border-green-100">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="bg-emerald-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-flag-checkered text-xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800">3. 마무리 (수업 정리)</h3>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-inner mb-4">
                        <p id="content-wrapup" class="text-gray-700 leading-relaxed text-lg font-medium text-center">
                            <!-- 내용 -->
                        </p>
                    </div>
                    <!-- 다음 시간 예고 -->
                    <div class="bg-emerald-600 text-white p-4 rounded-xl flex items-center gap-3 shadow-md">
                        <i class="fa-solid fa-forward-step text-xl"></i>
                        <div>
                            <span class="block text-xs text-emerald-200 font-bold mb-1">NEXT CLASS</span>
                            <p id="content-next" class="font-bold text-sm sm:text-base">
                                <!-- 다음 시간 내용 -->
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 text-center text-gray-400 text-sm">
            <p>© 2026 선생님의 수학 교실. All rights reserved.</p>
        </div>
    </footer>

    <!-- 질문하기 모달 (안내창) -->
    <div id="question-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-[fadeIn_0.3s_ease-out]">
            <div class="bg-amber-400 px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-amber-950 flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> 선생님께 질문하기
                </h3>
                <button onclick="closeQuestionModal()" class="text-amber-950/50 hover:text-amber-950">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <p class="text-gray-600 text-sm mb-4">공부하다 막히는 부분이 있나요? 질문을 남겨주시면 선생님이 확인 후 답변해 줄게요!</p>
                <textarea id="question-input" rows="4" class="w-full border-2 border-gray-100 rounded-2xl p-4 focus:border-amber-400 focus:outline-none transition-colors resize-none mb-4" placeholder="무엇이 궁금한가요?"></textarea>
                <button onclick="submitQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors shadow-lg">
                    질문 전송하기
                </button>
            </div>
        </div>
    </div>

    <script>
        // 선생님이 수정하시기 편하도록 데이터를 객체 형태로 분리했습니다.
        const mathData = {
            1: [
                {
                    id: '1-1',
                    title: '1. 소인수분해',
                    subtitle: '숫자들의 숨겨진 DNA를 찾아라! 🧬',
                    hook: '<strong>흥미 유발:</strong> "세상에서 가장 안전한 암호는 어떻게 만들어질까?"<br><br><strong>질문:</strong> "모든 숫자는 더 이상 쪼개지지 않는 기본 블록들로 만들어졌다고? 그 블록의 정체는 무엇일까?"',
                    keywords: ['소수', '합성수', '소인수', '소인수분해'],

                    imageText: '<i class="fa-solid fa-sitemap text-3xl mb-2 block"></i>소인수분해<br>트리 구조(가지치기)',
                    wrapup: '모든 자연수(1 제외)는 소수들의 곱으로 나타낼 수 있으며, 그 방법은 오직 한 가지뿐이다!',
                    next: '소인수분해로 어떻게 최대공약수와 최소공배수를 쉽게 구할 수 있을까?'
                },
                {
                    id: '1-2',
                    title: '2. 정수와 유리수',
                    subtitle: '0보다 작은 세상으로의 초대 ❄️',
                    hook: '<strong>흥미 유발:</strong> 온도계, 해수면의 높이, 통장 잔고(적자/흑자) 등 실생활에서 음수가 쓰이는 상황 상상해보기.<br><br><strong>질문:</strong> "지하 2층은 수학으로 어떻게 표현할까? 만약 내 용돈이 마이너스가 된다면?!"',
                    keywords: ['양수', '음수', '정수', '유리수', '수직선', '절댓값'],
                    concept: '<strong>핵심 개념:</strong> 0을 기준으로 서로 반대되는 성질을 가진 수량을 양수와 음수로 표현합니다. 수직선을 이용하면 크기를 쉽게 비교할 수 있어요.<br><br><strong>핵심 질문:</strong> -5와 -3 중 어느 쪽이 더 큰 수일까요? 수직선을 떠올려 보세요!',
                    imageText: '<i class="fa-solid fa-arrows-left-right text-3xl mb-2 block"></i>0을 기준으로 뻗어 나가는<br>수직선 이미지',
                    wrapup: '수직선을 이용하면 정수와 유리수의 크기를 한눈에 비교할 수 있다. 절댓값은 0에서부터의 거리!',
                    next: '음수끼리 더하고 빼면 어떻게 될까? 수직선 위에서의 마법 같은 계산!'

                {
                    id: '1-3',

                    keywords: ['대입', '식의 값', '일차식', '동류항'],
                    concept: '<strong>핵심 개념:</strong> 구체적인 숫자 대신 기호(문자)를 사용하면 복잡한 수량 관계를 간단한 수식으로 나타낼 수 있습니다.<br><br><strong>핵심 질문:</strong> 사과 x개의 가격이 1000원일 때, 사과 3개의 가격을 문자를 사용한 식으로 나타내면?',
                    imageText: '<i class="fa-solid fa-box-open text-3xl mb-2 block"></i>미지수 x, y 상자와<br>결과값이 나오는 함수 기계',
                    wrapup: '문자를 사용하면 복잡한 수량 관계를 간단하고 명확하게 식으로 표현할 수 있다!',
                    next: '문자가 포함된 식도 계산할 수 있다고? 동류항의 비밀을 밝혀라!'
                }
            ],
            2: [
                {
                    id: '2-1',
                    title: '1. 유리수와 순환소수',
                    subtitle: '끝없이 반복되는 숫자의 비밀 ♾️',
                    hook: '<strong>흥미 유발:</strong> 1 ÷ 3 = 0.33333... 처럼 끝없이 이어지는 계산기 화면 보여주기.<br><br><strong>질문:</strong> "끝이 없는 소수도 분수로 바꿀 수 있을까? 영원히 반복되는 이 숫자들의 정체는?"',
                    keywords: ['유한소수', '무한소수', '순환소수', '순환마디'],
                    concept: '<strong>핵심 개념:</strong> 분수를 소수로 바꿀 때, 나누어떨어지는 경우(유한소수)와 일정한 숫자가 끝없이 반복되는 경우(순환소수)가 있습니다.<br><br><strong>핵심 질문:</strong> 1/7을 소수로 나타내면 어떤 숫자들이 반복될까요?',

                },
                {
                    id: '2-2',
                    title: '2. 식의 계산 (다항식의 곱셈)',
                    subtitle: '퍼즐 맞추듯 식을 전개해보자! 🧩',
                    hook: '<strong>흥미 유발:</strong> 가로가 (x+2), 세로가 (x+3)인 직사각형 모양의 화단 넓이 구하기 문제.<br><br><strong>질문:</strong> "괄호가 있는 두 식을 곱하려면 어떻게 해야 할까? 마법의 공식을 찾아볼까?"',
                    keywords: ['전개', '다항식의 곱셈', '곱셈 공식'],
                    concept: '<strong>핵심 개념:</strong> 분배법칙을 이용하여 괄호를 풀어 하나의 다항식으로 나타내는 것을 전개라고 합니다. 곱셈 공식을 알면 훨씬 빨라져요.<br><br><strong>핵심 질문:</strong> (x+a)(x+b)를 전개하면 어떤 모양이 될까요? 규칙을 찾아보세요!',
                    imageText: '<i class="fa-solid fa-vector-square text-3xl mb-2 block"></i>직사각형의 넓이를 4개로 쪼갠<br>도형 넓이 모델',
                    wrapup: '다항식의 곱셈은 분배법칙을 이용하여 전개한다. 곱셈 공식을 외워두면 계산이 훨씬 빨라진다!',
                    next: '전개의 반대말은? 다항식을 다시 묶어주는 인수분해의 세계로!'
                },
                {
                    id: '2-3',
                    title: '3. 일차함수와 그래프',
                    subtitle: '변화하는 세상을 그래프로 그리다 📈',
                    hook: '<strong>흥미 유발:</strong> 스마트폰 요금제, 택시 요금 계산기 등 실생활 예시.<br><br><strong>질문:</strong> "두 양 사이의 관계를 한눈에 알아보기 쉽게 그림으로 표현할 수는 없을까?"',
                    keywords: ['함수', '일차함수', 'x절편', 'y절편', '기울기'],
                    concept: '<strong>핵심 개념:</strong> y = ax + b 모양의 일차함수를 좌표평면 위에 그리면 직선 모양의 그래프가 됩니다. a는 기울기, b는 y절편을 뜻해요.<br><br><strong>핵심 질문:</strong> 기울기가 커지면 직선은 어떻게 변할까요?',
                    imageText: '<i class="fa-solid fa-chart-line text-3xl mb-2 block"></i>기울기와 y절편에 따라<br>변화하는 직선 그래프',
                    wrapup: '일차함수의 그래프는 직선 모양이며, 기울기와 절편을 알면 그래프를 쉽게 그릴 수 있다!',
                    next: '일차함수와 일차방정식은 어떤 관계일까? 두 직선이 만나는 교점의 비밀!'
                }

        };

        let currentGrade = 1;
        let currentUnitId = '1-1';

        // 학년 탭 변경 함수
        function setGrade(grade) {
            currentGrade = grade;
            
            // 탭 스타일 업데이트
            document.getElementById('btn-grade1').className = `flex-1 py-3 rounded-xl transition-all duration-200 text-center ${grade === 1 ? 'tab-active' : 'tab-inactive'}`;
            document.getElementById('btn-grade2').className = `flex-1 py-3 rounded-xl transition-all duration-200 text-center ${grade === 2 ? 'tab-active' : 'tab-inactive'}`;
            
            // 기본 선택 단원을 해당 학년의 첫 번째 단원으로 설정
            currentUnitId = mathData[grade][0].id;
            
            renderUnitList();
            renderContent();
        }

        // 단원 목록 렌더링 함수
        function renderUnitList() {
            const listContainer = document.getElementById('unit-list');
            listContainer.innerHTML = ''; // 초기화
            
            mathData[currentGrade].forEach(unit => {
                const btn = document.createElement('button');
                const isActive = unit.id === currentUnitId;
                
                btn.className = `w-full text-left px-5 py-3 text-sm transition-colors duration-150 ${isActive ? 'unit-active' : 'unit-inactive border-b border-gray-50'}`;
                btn.onclick = () => {
                    currentUnitId = unit.id;
                    renderUnitList(); // 목록 활성화 상태 다시 그리기
                    renderContent();  // 오른쪽 콘텐츠 다시 그리기
                };
        // 질문하기 모달 제어 함수
        function openQuestionModal() {
            document.getElementById('question-modal').classList.remove('hidden');
            document.getElementById('question-modal').classList.add('flex');
            document.body.style.overflow = 'hidden'; // 스크롤 방지
        }

        function closeQuestionModal() {
            document.getElementById('question-modal').classList.add('hidden');
            document.getElementById('question-modal').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function submitQuestion() {
            const input = document.getElementById('question-input');
            if (!input.value.trim()) {
                return; // 내용이 없으면 아무것도 안 함
            }
            
            // 실제 서버 전송 로직 대신 완료 메시지 표시
            const originalContent = input.value;
            input.value = "";
            closeQuestionModal();
            
            // 알림 대신 사용할 간단한 토스트 메시지나 메시지 박스
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl z-[200] animate-bounce';
            toast.innerText = "🚀 질문이 선생님께 전달되었습니다!";
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // 초기화 (페이지 로드 시 실행)
        window.onload = () => {
            setGrade(1); // 1학년 기본 설정
        };
    </script>
</body>
</html>
